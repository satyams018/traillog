# Local services only. Django, Celery and Vite run natively to save RAM (SPEC §4).
services:
  db:
    image: ${POSTGIS_IMAGE:-imresamu/postgis:16-3.5}
    environment:
      POSTGRES_USER: traillog
      POSTGRES_PASSWORD: traillog
      POSTGRES_DB: traillog
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traillog"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]

  # Local S3-compatible storage (stands in for Cloudflare R2). MinIO no longer publishes
  # Docker images, so SeaweedFS is used instead. Dev-only credentials live in
  # docker/seaweedfs-s3.json. Create the bucket with: uv run python manage.py ensure_bucket
  s3:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-s3.port=9000", "-s3.config=/etc/seaweedfs/s3.json", "-volume.max=20", "-master.volumeSizeLimitMB=64"]
    ports: ["9000:9000"]
    volumes:
      - s3data:/data
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  pgdata:
  redisdata:
  s3data:
