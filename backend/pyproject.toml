[project]
name = "traillog-backend"
version = "0.1.0"
description = "TrailLog API: GPX processing, photos and share pages"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.9",
    "celery[redis]>=5.7.0",
    "django>=6.1.3",
    "django-allauth[headless]>=65.22.1",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "gpxpy>=1.6.2",
    "gunicorn>=27.0.1",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "psycopg[binary]>=3.3.9",
    "timezonefinder>=9.2.0",
    "whitenoise>=6.12.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S105", "S106", "S311"]  # test passwords, seeded random

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.6",
]
